<meta charset="UTF-8">

<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />

<link rel="stylesheet" href="/leaflet/leaflet.css" />
<link rel="stylesheet" href="styles.css" />

<div id="mapBrasil"></div>

<script src="leaflet/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>

<script>
    var map = L.map('mapBrasil', {
        zoomControl: false,
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
    }).setView([-14.235, -54], 4);

    map.scrollWheelZoom.disable();
    map.doubleClickZoom.disable();

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

    var geojsonLayer;
    var estadosGeoJSON;

    var filterJson = [
        {
            country: 'BRASIL',
            state: 'Goiás',
            uf: 'GO'
        },
        {
            country: 'BRASIL',
            state: 'São Paulo',
            uf: 'SP'
        },
        {
            country: 'BRASIL',
            state: 'Minas Gerais',
            uf: 'MG'
        }
    ];

    var filteredData = [];

    fetch('./brazil-states.geojson')
        .then(response => response.json())
        .then(data => {

            filteredData = filterDataByState(filterJson, data);

            let onForEachFeature = function (feature, layer) {

                let tooltipText = "Estado: " + feature.properties.state + "<br/> UF: " + feature.properties.uf + "<br/>";

                layer.bindPopup(tooltipText);
            };

            var geoJsonLayer = applyGeoJson(filteredData, onForEachFeature);

            geoJsonLayer.addTo(map);
        })
        .catch(error => console.error("Erro ao carregar o GeoJSON:", error));


    function applyGeoJson(data, onEachFeature) {

        return L.geoJSON(data, {
            style: {
                color: "#888888",
                weight: 2,
                fillColor: "#E5E5E5",
                fillOpacity: 0.7
            },
            onEachFeature: onEachFeature
        });
    }

    function filterDataByState(filterJson, data) {
        if (filterJson.length === 0) {
            return data;
        }
        else {
            return data.features.filter(feature => {
                return filterJson.some(f =>
                    f.state && f.uf &&
                    f.state.toLowerCase() === feature.properties.state?.toLowerCase() &&
                    f.uf.toLowerCase() === feature.properties.uf?.toLowerCase()
                );
            });
        }
    }
</script>
</body>

</html>
